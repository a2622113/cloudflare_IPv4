name: Update Cloudflare IPv4 List

on:
  schedule:
    # 每 6 小时跑一次（UTC）
    - cron: '0 */6 * * *'
  workflow_dispatch:      # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # 允许 git push 回仓库

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run script
        run: python cloudflare_IPv4.py

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ip.txt
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: update CF IPv4 list [skip ci]"
            git push
          fi
